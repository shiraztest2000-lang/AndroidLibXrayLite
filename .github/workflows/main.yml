name: Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag to publish (for example v.03)'
        required: false
        default: 'v.03'
        type: string
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'publish/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup Golang
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH=$PATH:~/go/bin
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

    - name: Build
      run: |
         mkdir -p assets data
         bash gen_assets.sh download
         cp -v data/*.dat assets/
         gomobile init
         go mod tidy
         gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./
 
    - name: Upload build artifacts
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
      uses: actions/upload-artifact@v7
      with:
        name: libv2ray
        path: |
          ${{ github.workspace }}/libv2ray*r

    - name: Create release tag
      if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/publish/')
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const tag = core.getInput('release_tag') || context.refName.replace(/^publish\\//, '');
          const ref = `refs/tags/${tag}`;
          try {
            await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}` });
          } catch (error) {
            if (error.status !== 404) throw error;
            await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo, ref, sha: context.sha });
          }

    - name: Upload AndroidLibXrayLite to release
      if: github.event.inputs.release_tag != '' || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/publish/')
      uses: svenstaro/upload-release-action@v2
      with:
        file: ./libv2ray*r
        tag: ${{ inputs.release_tag || github.ref_name }}
        file_glob: true
